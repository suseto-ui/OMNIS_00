name: O.M.N.I.S. APEX v4.5.0-GA Production CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: "17"

jobs:
  backend-security-and-quality-gate:
    name: "Fáze 1A: Python Quality, Bandit, Ruff, Radon & Pytest (>=80%)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Backend & Security Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.txt pytest pytest-cov ruff bandit radon "httpx<0.28"

      - name: Python Syntax & Static Security Scan (py_compile, ruff, bandit, radon)
        run: |
          python3 -m py_compile $(find backend scripts -name "*.py")
          ruff check backend/ scripts/
          bandit -r backend/ scripts/ -ll --exclude backend/tests/,backend/test_akge_full_suite.py,backend/test_routers.py,backend/test_sync_gateway.py,backend/test_auth_strategy.py,backend/test_omnis_phases.py,backend/test_quality_gate.py
          radon cc backend/ -s -nc --total-average -a --max B

      - name: Unified DB, Docker & Vault Pre-Deletion / Legacy Parity Gate
        run: |
          chmod +x scripts/pre_deletion_gate.sh scripts/verify_and_clean_legacy.sh
          ./scripts/pre_deletion_gate.sh
          ./scripts/verify_and_clean_legacy.sh --verify-only

      - name: Run Full Pytest Suite with Branch Coverage (>=80%)
        run: |
          export PYTHONPATH=.
          pytest backend/ --cov=backend --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80
          python3 scripts/verify_quality_gate.py --coverage-xml coverage.xml

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 14

  android-detekt-and-unit-tests:
    name: "Fáze 1B: Detekt Kotlin Audit & Full Unit/Robolectric Suite"
    runs-on: ubuntu-latest
    needs: [ backend-security-and-quality-gate ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }} & Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Run Detekt Kotlin Static Analysis (detekt.yml)
        uses: natiginfo/action-detekt-all@v1.23.7
        with:
          config: detekt.yml
          input: app/src/main/java
          build-upon-default-config: true
          fail-fast: false

      - name: Execute Full Android Unit & Robolectric Tests
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  android-release-build-and-checksums:
    name: "Fáze 5: Android Release R8/ProGuard Build & SHA-256 Checksums"
    runs-on: ubuntu-latest
    needs: [ android-detekt-and-unit-tests ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }} & Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Decode Optional Release Keystore
        if: ${{ secrets.OMNIS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.OMNIS_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/omnis-release.jks"
          echo "OMNIS_KEYSTORE_FILE=${{ runner.temp }}/omnis-release.jks" >> "$GITHUB_ENV"
          echo "OMNIS_SIGNING_STATUS=SIGNED" >> "$GITHUB_ENV"

      - name: Warn on Missing Release Keystore (Unsigned R8 Provenance)
        if: ${{ secrets.OMNIS_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::OMNIS_KEYSTORE_BASE64 is missing — emitting UNSIGNED R8/ProGuard release APK & AAB (OMNIS_SIGNING_STATUS=UNSIGNED_R8_ONLY)."
          echo "OMNIS_SIGNING_STATUS=UNSIGNED_R8_ONLY" >> "$GITHUB_ENV"

      - name: Build Minified Release APK & AAB
        env:
          OMNIS_BACKEND_URL: ${{ secrets.OMNIS_BACKEND_URL }}
          OMNIS_KEYSTORE_PASSWORD: ${{ secrets.OMNIS_KEYSTORE_PASSWORD }}
          OMNIS_KEY_ALIAS: ${{ secrets.OMNIS_KEY_ALIAS }}
          OMNIS_KEY_PASSWORD: ${{ secrets.OMNIS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          fi

      - name: Generate Release Artifacts, Provenance & SHA256SUMS.txt
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-artifacts/ \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-artifacts/ \;
          SIGNING_STATUS="${OMNIS_SIGNING_STATUS:-UNSIGNED_R8_ONLY}"
          {
            echo "SIGNING_STATUS=${SIGNING_STATUS}"
            echo "R8_MINIFICATION=ENABLED"
            echo "BUILT_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "KEYSTORE_PRESENT=$( [ "${SIGNING_STATUS}" = "SIGNED" ] && echo "true" || echo "false" )"
          } > release-artifacts/SIGNING_STATUS.txt
          cat release-artifacts/SIGNING_STATUS.txt
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload Signed/Minified Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnis-v4.5.0-ga-release
          path: release-artifacts/
          retention-days: 30

  sonarcloud-quality-gate:
    name: "Fáze 1C: SonarCloud Quality Gate (Zero Debt)"
    runs-on: ubuntu-latest
    needs: [ backend-security-and-quality-gate, android-detekt-and-unit-tests ]
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
