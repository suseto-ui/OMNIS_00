name: Deploy Production Android Release (AAB & APK)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Production Cloud Run OMNIS_BACKEND_URL"
        required: false
        default: "https://ais-dev-43vgrwdupsfj4ht5yohxcz-291037164760.europe-west3.run.app"

permissions:
  contents: write

jobs:
  test_and_release:
    name: Verify Unit Tests & Build Release AAB/APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Verification Gate
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Android Release AAB & APK
        env:
          OMNIS_BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://ais-dev-43vgrwdupsfj4ht5yohxcz-291037164760.europe-west3.run.app' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:bundleRelease :app:assembleRelease -POMNIS_BACKEND_URL="$OMNIS_BACKEND_URL" --no-daemon --stacktrace
          else
            gradle :app:bundleRelease :app:assembleRelease -POMNIS_BACKEND_URL="$OMNIS_BACKEND_URL" --no-daemon --stacktrace
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build-artifacts
          AAB_PATH=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" build-artifacts/Omnis-release.aab
          fi
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/Omnis-release.apk
          fi
          ls -lh build-artifacts/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Omnis-release-artifacts
          path: build-artifacts/
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "O.M.N.I.S. APEX ${{ github.ref_name }}"
          body: |
            ### 🚀 O.M.N.I.S. APEX v4.5 Production Release
            - **Unit & Robolectric Gate:** PASSED
            - **Release Artifacts:** `Omnis-release.aab` & `Omnis-release.apk`
            - **Commit SHA:** `${{ github.sha }}`
          files: build-artifacts/*
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
