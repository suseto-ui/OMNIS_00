name: O.M.N.I.S. APEX Unified CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-audit-and-quality-gate:
    name: Backend FastAPI Audit & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements.txt pytest pytest-cov radon "httpx<0.28"

      - name: Syntax & Quality Gate Check
        run: |
          python3 -m py_compile $(find backend scripts -name "*.py")
          export PYTHONPATH=.
          python3 backend/run_backend_audit_tests.py
          pytest backend/ --cov=backend --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=80
          python3 scripts/verify_quality_gate.py --coverage-xml coverage.xml

  firestore-rules-verification:
    name: Firestore Zero-Trust Security Rules Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Run Firestore Emulator Security Tests
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase
          NODE_PATH="$(npm root -g):./node_modules" firebase emulators:exec --only firestore,auth --project demo-no-project \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js"

  android-test-and-bundle:
    name: Android Unit/Robolectric Gate & Release Bundle
    runs-on: ubuntu-latest
    needs: [backend-audit-and-quality-gate, firestore-rules-verification]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
      - uses: android-actions/setup-android@v3

      - name: Run Robolectric & Unit Test Suite
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Release App Bundle (AAB)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:bundleRelease --no-daemon --stacktrace
          else
            gradle :app:bundleRelease --no-daemon --stacktrace
          fi

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omnis-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
