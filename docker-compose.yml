version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: backend/db/Dockerfile.postgres
    container_name: omnis_pg17
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_preload_libraries=age"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "max_slot_wal_keep_size=2GB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnis_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      POSTGRES_AUDIT_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:-}
      POSTGRES_SYNC_PASSWORD: ${POSTGRES_SYNC_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - pg17_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/db/02-apply-role-passwords.sh:/docker-entrypoint-initdb.d/02-apply-role-passwords.sh:ro
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnis_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  electric:
    image: electricsql/electric:1.8.1
    container_name: omnis_electric
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_SYNC_USER:-postgres}:${POSTGRES_SYNC_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}@db:5432/${POSTGRES_DB:-omnis_db}?sslmode=disable
      ELECTRIC_INSECURE: ${ELECTRIC_INSECURE:-true}
      ELECTRIC_PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - electric_data:/var/lib/electric/data
    healthcheck:
      test: ["CMD-SHELL", "(wget -qO- http://127.0.0.1:3000/v1/health || curl -sf http://127.0.0.1:3000/v1/health || nc -z 127.0.0.1 3000) >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnis_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      electric:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-postgres}:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}@db:5432/${POSTGRES_DB:-omnis_db}
      AUDIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_AUDIT_USER:-postgres}:${POSTGRES_AUDIT_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}@db:5432/${POSTGRES_DB:-omnis_db}
      ELECTRIC_URL: ${ELECTRIC_URL:-http://electric:3000}
      USE_OSS_POSTGRES_SYNC: ${USE_OSS_POSTGRES_SYNC:-true}
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-gemma4_local}
      GEMMA4_API_BASE_URL: ${GEMMA4_API_BASE_URL:-http://host.docker.internal:11434/v1}
      GEMMA4_MODEL_NAME: ${GEMMA4_MODEL_NAME:-gemma4:e4b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY must be set in .env}
      OMNIS_SYNC_API_KEY: ${OMNIS_SYNC_API_KEY:?OMNIS_SYNC_API_KEY must be set in .env}
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "(curl -sf http://127.0.0.1:8000/healthz || python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\") >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "0.5"

  caddy:
    image: caddy:2-alpine
    container_name: omnis_caddy
    restart: unless-stopped
    depends_on:
      - backend
      - electric
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-omnis.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"

volumes:
  pg17_data:
  electric_data:
  caddy_data:
  caddy_config:
