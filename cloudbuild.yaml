# ==========================================================
# Google Cloud Build Pipeline for O.M.N.I.S. (Free Tier Optimized)
# Pre-Flight -> Artifact Registry Check -> Docker Build & ASGI Smoke Test -> Cloud Run Deploy
# ==========================================================

steps:
  # Step 0: Quality Gate & Code Syntax Verification
  - name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "=== [CI/CD Step 0] Pre-flight Syntax & Quality Gate Verification ==="
        python3 -m py_compile $$(find backend scripts -name "*.py")
        python3 scripts/verify_quality_gate.py
        echo "QUALITY GATE VERIFIED: Zero syntax errors, ready for container build."

  # Step 0.5: Ensure Artifact Registry Repository Exists in Target Region
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if ! gcloud artifacts repositories describe ${_REPOSITORY} --location=${_REGION} --project=${PROJECT_ID} >/dev/null 2>&1; then
          echo "Creating Artifact Registry repository: ${_REPOSITORY} in ${_REGION}..."
          gcloud artifacts repositories create ${_REPOSITORY} \
            --repository-format=docker \
            --location=${_REGION} \
            --project=${PROJECT_ID} \
            --description="Docker repository for O.M.N.I.S." || true
        else
          echo "Artifact Registry repository ${_REPOSITORY} verified."
        fi

  # Step 1: Build Production Multi-Stage Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend:${_TAG}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend:latest"
      - "-f"
      - "Dockerfile"
      - "."

  # Step 1.5: Container ASGI Import & Route Smoke Verification (before push/deploy)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "=== [CI/CD Step 1.5] Verifying built container ASGI bootstrap & mounted routes ==="
        docker run --rm --entrypoint python3 \
          "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend:${_TAG}" \
          -c "from backend.main import app; print('ASGI_READY routes=', len(app.routes))"

  # Step 2: Push Container Image to Google Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend"

  # Step 3: Deploy to Google Cloud Run (Free Tier Optimized: 0 idle cost, 512MiB, 1 vCPU, 0-3 instances)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "=== [CI/CD Step 3] Deploying to Google Cloud Run (${_SERVICE_NAME}) ==="

        SA_FLAG=""
        if gcloud iam service-accounts describe omnis-cloud-run@${PROJECT_ID}.iam.gserviceaccount.com --project=${PROJECT_ID} >/dev/null 2>&1; then
          SA_FLAG="--service-account=omnis-cloud-run@${PROJECT_ID}.iam.gserviceaccount.com"
          echo "Using dedicated runtime service account: omnis-cloud-run"
        else
          echo "Using default compute service account"
        fi

        CLOUDSQL_FLAG=""
        SECRETS_SPEC="SECRET_KEY=JWT_SECRET_KEY:latest,AUDIT_HMAC_KEY=AUDIT_HMAC_KEY:latest,OMNIS_SYNC_API_KEY=OMNIS_SYNC_API_KEY:latest,OMNIS_ADMIN_SECRET_HASHES=OMNIS_ADMIN_SECRET_HASHES:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest"
        if [ -n "${_CLOUDSQL_INSTANCE}" ]; then
          CLOUDSQL_FLAG="--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}"
          SECRETS_SPEC="$${SECRETS_SPEC},DATABASE_URL=OMNIS_DATABASE_URL:latest"
          echo "Attaching optional Cloud SQL instance: ${_CLOUDSQL_INSTANCE}"
        fi

        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --ingress=all \
          --allow-unauthenticated \
          --port=8080 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=80 \
          --timeout=300s \
          $$SA_FLAG \
          $$CLOUDSQL_FLAG \
          --set-env-vars=ENV=production,REQUIRE_APP_CHECK=true,PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GEMINI_MODEL=gemini-2.5-flash,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},ENABLE_FIRESTORE_CQRS_PROJECTION=true \
          --set-secrets=$$SECRETS_SPEC

        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --project=${PROJECT_ID} --format='value(status.url)')
        echo "=== Cloud Run Service Deployed: $$SERVICE_URL ==="

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/omnis-backend:latest"

substitutions:
  _REGION: "europe-west1"
  _TAG: "manual"
  _REPOSITORY: "omnis-repo"
  _SERVICE_NAME: "omnis-backend"
  _FIREBASE_PROJECT_ID: "gen-lang-client-0328950802"
  _FIRESTORE_DATABASE_ID: "ai-studio-android-omnis-fba4ba28-3ec2-4eaf-a1a7-338554af8dfe"
  _CLOUDSQL_INSTANCE: ""

options:
  logging: CLOUD_LOGGING_ONLY
